name: Fetch Market Data

on:
  # The data must land after one session's close and before the 12:00 UTC
  # predictor. GitHub starts scheduled runs hours late, so fire just after the
  # close (21:15 UTC is past it on both EDT and EST) with an overnight backup;
  # a delay of up to ~9 hours still lands before the predictor. A run that slips
  # into the next session is harmless: fetch_data.py ignores unfinished bars.
  schedule:
    - cron: "15 21 * * 1-5"
    - cron: "0 3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q requests pandas numpy

      - name: Fetch market data from Alpaca
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python fetch_data.py

      - name: Commit and push data
        run: |
          git config user.email "action@github.com"
          git config user.name "Market Data Bot"
          test -f data/market_context.json || { echo "fetch produced no market_context.json"; exit 1; }
          test -f data/bars.json || { echo "fetch produced no bars.json"; exit 1; }
          git add data/
          if git diff --cached --quiet; then
            echo "Data files unchanged since last run"
            exit 0
          fi
          git diff --cached --name-only | grep -q '^data/' || {
            echo "data/ files exist but were not staged — check .gitignore"
            exit 1
          }
          git commit -m "Daily market data $(date -u +%Y-%m-%d)"
          # The trade legs and the cloud routine also push to main, so the ref
          # often moves between checkout and here; rebase onto it and retry.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          echo "could not push market data after 3 attempts"
          exit 1
