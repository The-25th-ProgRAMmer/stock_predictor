name: Paper Trade

# Execution lives in Actions, not in the cloud routine: the routine sandbox can
# only reach github.com and pypi.org, so it cannot talk to Alpaca at all.
#
# Three scheduled legs, run repeatedly, because GitHub cron is UTC and US market
# hours shift with daylight saving. Every script gates on Alpaca's own /v2/clock,
# so the attempts that fall outside their window exit without trading:
#
#   enter  12:20-14:20 UTC, every 20 min   opening-auction orders
#   arm    13:45 / 14:45 UTC               attach a take-profit / stop pair to each fill
#   sweep  19:30 / 20:30 UTC               time-stop 21+ sessions old; flag unbracketed
#
# The enter leg is fired seven times because its window is narrow and GitHub cron
# is best-effort: enter_trades.py only acts between 75 and 3 minutes before the
# open (opg orders are refused once trading starts), which is 12:15-13:27 UTC on
# EDT and 13:15-14:27 UTC on EST. Firing every 20 minutes across both ranges
# leaves four chances per regime to land inside one, so a delayed or dropped run
# is not a missed trading day. Duplicates are free: the client_order_id is
# deterministic, so Alpaca rejects a second attempt instead of doubling up.
#
# There is deliberately no leg that closes positions at the end of the day, and
# no intraday polling. Once a position is armed, the take-profit / stop pair
# rests at Alpaca as a one-cancels-other order and fills on its own whenever the
# price gets there - which is the whole point of resting it rather than checking.
#
# reconcile runs on the arm and sweep legs. It has to run the morning after as
# well as the evening of, because a closing-auction exit submitted at 19:30 is
# not filled until the 20:00 close.
#
# Orders carry deterministic client_order_ids, so a duplicate run is rejected by
# Alpaca rather than doubling a position.

on:
  schedule:
    - cron: "20 12 * * 1-5"
    - cron: "40 12 * * 1-5"
    - cron: "0 13 * * 1-5"
    - cron: "20 13 * * 1-5"
    - cron: "40 13 * * 1-5"
    - cron: "0 14 * * 1-5"
    - cron: "20 14 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:
    inputs:
      action:
        description: "Which leg to run (flatten closes EVERYTHING)"
        required: true
        default: "enter"
        type: choice
        options: [enter, arm, sweep, reconcile, flatten]
      dry_run:
        description: "Resolve and print without sending orders"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - run: pip install -q requests

      - name: Decide leg
        id: leg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "leg=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            echo "dry=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            # Every cron is mapped explicitly and an unknown one is a hard error:
            # a silent fallback would quietly run the wrong leg at the wrong hour
            # if a schedule were added here and not mapped below.
            case "${{ github.event.schedule }}" in
              "20 12 * * 1-5"|"40 12 * * 1-5"|"0 13 * * 1-5"|\
              "20 13 * * 1-5"|"40 13 * * 1-5"|"0 14 * * 1-5"|\
              "20 14 * * 1-5")                  echo "leg=enter" >> "$GITHUB_OUTPUT" ;;
              "45 13 * * 1-5"|"45 14 * * 1-5")  echo "leg=arm"   >> "$GITHUB_OUTPUT" ;;
              "30 19 * * 1-5"|"30 20 * * 1-5")  echo "leg=sweep" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "unmapped schedule '${{ github.event.schedule }}'" >&2
                exit 1
                ;;
            esac
            echo "dry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enter positions
        if: steps.leg.outputs.leg == 'enter'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADING_DISABLED: ${{ vars.TRADING_DISABLED }}
        run: |
          if [ "${{ steps.leg.outputs.dry }}" = "true" ]; then
            python enter_trades.py --dry-run
          else
            python enter_trades.py
          fi

      - name: Arm take-profit and stop
        if: steps.leg.outputs.leg == 'arm'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADING_DISABLED: ${{ vars.TRADING_DISABLED }}
        run: |
          if [ "${{ steps.leg.outputs.dry }}" = "true" ]; then
            python arm_exits.py --dry-run
          else
            python arm_exits.py
          fi

      - name: Sweep time stops
        if: steps.leg.outputs.leg == 'sweep'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADING_DISABLED: ${{ vars.TRADING_DISABLED }}
        run: |
          if [ "${{ steps.leg.outputs.dry }}" = "true" ]; then
            python sweep_exits.py --dry-run
          else
            python sweep_exits.py
          fi

      - name: Flatten everything (manual only)
        if: steps.leg.outputs.leg == 'flatten'
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TRADING_DISABLED: ${{ vars.TRADING_DISABLED }}
        run: |
          if [ "${{ steps.leg.outputs.dry }}" = "true" ]; then
            python exit_trades.py --dry-run
          else
            python exit_trades.py
          fi

      # Brackets fill at Alpaca with nothing running here, so reconciliation is
      # what discovers them. It must run in the morning too: a closing-auction
      # exit sent at 19:30 only fills at the 20:00 close.
      - name: Reconcile fills and P&L
        if: >-
          steps.leg.outputs.dry != 'true' &&
          (steps.leg.outputs.leg == 'arm' ||
           steps.leg.outputs.leg == 'sweep' ||
           steps.leg.outputs.leg == 'reconcile')
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python reconcile.py || echo "reconcile reported an issue (non-fatal)"

      - name: Commit trade log
        if: always() && steps.leg.outputs.dry != 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "Paper Trade Bot"
          git add logs/
          if git diff --cached --quiet; then
            echo "No trade-log changes to commit"
            exit 0
          fi
          git commit -m "Paper trading ${{ steps.leg.outputs.leg }} $(date -u +%Y-%m-%d)"
          # Another job may have pushed between checkout and now; rebase and retry.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying"
            sleep 5
          done
          echo "could not push trade log after 3 attempts"
          exit 1
